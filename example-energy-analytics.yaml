    energy: sensor.goodwe_pv_generation_total
    installed_kwp: 7.92
    children:
      - name: MPPT 1 Garten
        energy: sensor.goodwe_mppt1_generation_total
        installed_kwp: 4.95
      - name: MPPT 2 Straße
        energy: sensor.goodwe_mppt2_generation_total
        installed_kwp: 2.97

  - name: Garage
    energy: sensor.victron_pv_generation_total
    installed_kwp: 1.76
    children:
      - name: MPPT 1 Hinten
        energy: sensor.victron_mppt1_generation_total
        installed_kwp: 0.88
      - name: MPPT 2 Straße
        energy: sensor.victron_mppt2_generation_total
        installed_kwp: 0.88

  - name: Pavillon
    energy: sensor.pavillon_generation_total
    installed_kwp: 0.2
