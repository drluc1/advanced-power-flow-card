type: custom:advanced-power-flow-card
title: Energieverbrauch
power_threshold: 5
balance_warning_threshold: 50
text_size: xlarge
mobile_scale: 1.08
layout_density: auto
pv_layout: grouped
pv_detail_level: compact
pv_show_status: true
pv_show_relative_power: true
pv_compact_mppt_bars: true
night_pv_collapse: true
battery_layout: grouped
supply_node: full
daily_items:
  - pv
  - house
  - grid-import
  - grid-export
  - autarky
  - self-consumption
daily_layout: cards
night_mode: true

solar:
  - name: Hausdach
    power: sensor.goodwe_pv_power
    daily_energy: sensor.goodwe_pv_energy_today
    daily_peak_power: sensor.goodwe_pv_peak_today
    installed_kwp: 5.94
    inverter_temperature: sensor.goodwe_inverter_temperature
    status: sensor.goodwe_status
    children:
      - name: MPPT 1 Gaube
        power: sensor.goodwe_pv1_power
        voltage: sensor.goodwe_pv1_voltage
        current: sensor.goodwe_pv1_current
        daily_energy: sensor.goodwe_pv1_energy_today
        daily_peak_power: sensor.goodwe_pv1_peak_today
        installed_kwp: 1.98
      - name: MPPT 2 Garten
        power: sensor.goodwe_pv2_power
        voltage: sensor.goodwe_pv2_voltage
        current: sensor.goodwe_pv2_current
        daily_energy: sensor.goodwe_pv2_energy_today
        installed_kwp: 1.98
      - name: MPPT 3 Straße
        power: sensor.goodwe_pv3_power
        voltage: sensor.goodwe_pv3_voltage
        current: sensor.goodwe_pv3_current
        daily_energy: sensor.goodwe_pv3_energy_today
        installed_kwp: 1.98

  - name: Garage
    daily_energy: sensor.victron_pv_energy_today
    installed_kwp: 1.2
    children:
      - name: Victron MPPT 1
        power: sensor.victron_mppt_1_power
        voltage: sensor.victron_mppt_1_voltage
        current: sensor.victron_mppt_1_current
        daily_energy: sensor.victron_mppt_1_energy_today
      - name: Victron MPPT 2
        power: sensor.victron_mppt_2_power
        voltage: sensor.victron_mppt_2_voltage
        current: sensor.victron_mppt_2_current
        daily_energy: sensor.victron_mppt_2_energy_today

batteries:
  - name: Akku Garage
    power: sensor.battery_1_power
    soc: sensor.battery_1_soc
    positive_is_charging: true
    capacity_kwh: 5.0
    target_soc: 90
    reserve_soc: 10
    estimate_min_power_w: 100
    average_power: sensor.battery_1_power_5min
    max_charge_power_kw: 3.0
    max_discharge_power_kw: 3.0
    voltage: sensor.battery_1_voltage
    current: sensor.battery_1_current
    temperature: sensor.battery_1_temperature
    cell_min_voltage: sensor.battery_1_cell_min_voltage
    cell_max_voltage: sensor.battery_1_cell_max_voltage
    status: sensor.battery_1_bms_status
    daily_min_soc: sensor.battery_1_min_soc_today
    daily_max_soc: sensor.battery_1_max_soc_today
    daily_charge_energy: sensor.battery_1_charge_today
    daily_discharge_energy: sensor.battery_1_discharge_today

  - name: Akku Pylontech
    power: sensor.battery_2_power
    soc: sensor.battery_2_soc
    positive_is_charging: true
    capacity_kwh: 9.6
    target_soc: 90
    reserve_soc: 10
    estimate_min_power_w: 100

grid:
  power: sensor.grid_power
  positive_is_import: true

house:
  name: Haus

heat_pump:
  name: Wärmepumpe
  power: sensor.heatpump_power
  part_of_house: true
  display_temperature: sensor.heatpump_flow_temperature
  display_temperature_label: VL
  flow_temperature: sensor.heatpump_flow_temperature
  return_temperature: sensor.heatpump_return_temperature
  outdoor_temperature: sensor.heatpump_outdoor_temperature
  thermal_power: sensor.heatpump_thermal_power
  mode: sensor.heatpump_mode
  daily_energy: sensor.heatpump_daily_energy

consumers:
  - name: Wallbox
    power: sensor.wallbox_power
    part_of_house: true

daily:
  pv_energy: sensor.pv_energy_today
  grid_import_energy: sensor.grid_import_today
  grid_export_energy: sensor.grid_export_today
  house_energy: sensor.house_energy_today

tariffs:
  import_price: sensor.current_electricity_price
  export_price: sensor.current_feed_in_price
  fixed_import_price: 0.31
  fixed_export_price: 0.082
  currency: "€"

diagnostics:
  enabled: true
  pv_voltage_without_power_threshold: 80
  battery_cell_delta_warning: 0.05
  battery_temperature_low: 5
  battery_temperature_high: 45
  mppt_relative_warning_enabled: false
  mppt_relative_warning_ratio: 0.35
  mppt_daily_relative_warning_enabled: false
  mppt_daily_relative_warning_ratio: 0.35
  pv_temperature_high: 75
  stale_sensor_minutes: 0
